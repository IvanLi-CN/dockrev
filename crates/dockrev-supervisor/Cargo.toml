[package]
name = "dockrev-supervisor"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/IvanLi-CN/dockrev"
homepage = "https://github.com/IvanLi-CN"
authors = ["Ivan Li"]

[[bin]]
name = "dockrev-supervisor"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
dockrev-common = { path = "../dockrev-common" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
