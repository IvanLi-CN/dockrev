name: CI (PR)

on:
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.91.0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.merge_queue_defaults.outputs.web || steps.filter.outputs.web || 'false' }}
      docker: ${{ steps.merge_queue_defaults.outputs.docker || steps.filter.outputs.docker || 'false' }}
    steps:
      - name: Mark merge queue as full sweep
        if: github.event_name == 'merge_group'
        id: merge_queue_defaults
        shell: bash
        run: |
          {
            echo "web=true"
            echo "docker=true"
          } >> "$GITHUB_OUTPUT"

      - name: Paths filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - "web/**"
            docker:
              - "Dockerfile"
              - ".github/**"
              - "deploy/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**"
              - "src/**"
              - "web/**"

  lint:
    name: Lint & Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: target/ci/pr/${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: File budget check
        run: python3 ./.github/scripts/check-file-budgets.py

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --locked --all-targets --all-features

      - name: Release channel contract check
        run: bash ./.github/scripts/release-channel-contract-check.sh

      - name: Live quality-gates check
        env:
          QUALITY_GATES_LIVE_RULES_MODE: require
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ./.github/scripts/check-live-quality-gates.py \
            --declaration .github/quality-gates.json \
            --repo "${GITHUB_REPOSITORY}"

  worktree-bootstrap:
    name: Worktree bootstrap smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run worktree bootstrap smoke
        run: bash ./scripts/test-worktree-bootstrap.sh

  unit-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: target/ci/pr/${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Run cargo test
        run: cargo test --workspace --locked --all-features -- --test-threads=2

  deploy-smoke:
    name: Deploy Smoke
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy smoke
        shell: bash
        run: bash ./.github/scripts/deploy-smoke.sh

      - name: Upload deploy smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.job }}
          path: .artifacts/deploy-smoke
          if-no-files-found: error
          retention-days: 7

  frontend-lint-build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          # Avoid GitHub API rate limits (setup-bun fetches tags/releases).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: bun install (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile

      - name: Front-end lint + build
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun run lint
          bun run build
          DOCKREV_WEB_BASE=/demo/ bun run build:demo:pages

  frontend-storybook-build:
    name: Frontend Storybook build
    runs-on: ubuntu-latest
    needs: [frontend-lint-build]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          # Avoid GitHub API rate limits (setup-bun fetches tags/releases).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: bun install (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile

      - name: Build Storybook static bundle
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun run build-storybook -- --quiet

      - name: Upload Storybook static artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ github.sha }}
          path: web/storybook-static
          retention-days: 1
          if-no-files-found: error

  frontend-storybook-test:
    name: Frontend Storybook test
    runs-on: ubuntu-latest
    needs: [frontend-storybook-build]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          # Avoid GitHub API rate limits (setup-bun fetches tags/releases).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: bun install (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile

      - name: Download Storybook static artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static-${{ github.sha }}
          path: web/storybook-static

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run Storybook Playwright check (timeout + retry)
        shell: bash
        run: bash ./.github/scripts/storybook-ci-check.sh

  pr-release-check:
    name: Release build check (PR)
    runs-on: ubuntu-latest
    needs: [changes, lint, unit-tests]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    env:
      # Multi-arch (via QEMU) is validated on main/release publishes; keep PR checks fast.
      PLATFORMS: linux/amd64
      CARGO_TARGET_DIR: target/ci/pr
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun (only when web changed)
        if: ${{ needs.changes.outputs.web == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          # Avoid GitHub API rate limits when setup-bun resolves tags/releases.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Build web (only when web changed)
        if: ${{ needs.changes.outputs.web == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/package.json ]]; then
            cd web
            bun install --frozen-lockfile
            bun run build
          else
            echo "No web/ package; skipping"
          fi

      - name: Install system dependencies (musl)
        run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config libsqlite3-dev

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build dockrev (linux/amd64 musl) + stage docker artifact
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p dockrev-api --bin dockrev --release --locked --target x86_64-unknown-linux-musl
          cargo build -p dockrev-supervisor --bin dockrev-supervisor --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist/ci/docker/amd64
          cp target/ci/pr/x86_64-unknown-linux-musl/release/dockrev dist/ci/docker/amd64/dockrev
          cp target/ci/pr/x86_64-unknown-linux-musl/release/dockrev-supervisor dist/ci/docker/amd64/dockrev-supervisor

      - name: Smoke test (linux/amd64 musl)
        shell: bash
        env:
          DOCKREV_SMOKE_BIN: dist/ci/docker/amd64/dockrev
        run: bash ./.github/scripts/smoke-test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (single-arch; load; no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          tags: dockrev-pr:${{ github.sha }}
          target: runtime-prebuilt
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            APP_EFFECTIVE_VERSION=0.0.0-pr

      - name: Docker smoke (verify binaries executable)
        shell: bash
        run: |
          set -euo pipefail
          image="dockrev-pr:${{ github.sha }}"
          docker run --rm "$image" sh -lc 'set -eu; test -x /usr/local/bin/dockrev; test -x /usr/local/bin/dockrev-supervisor'
