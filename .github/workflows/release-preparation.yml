name: Release Preparation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version intent or exact SemVer release target
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-preparation-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare VERSION identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main release policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Allocate and open the immutable version identity PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_preparation.py \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GITHUB_TOKEN}" \
            --version "${VERSION_INPUT}" \
            --output release-identity.json

      - name: Summarize release identity
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("release-identity.json").read_text(encoding="utf-8"))
          print("## Release identity")
          print()
          print(f"- Decision: `{data['version_input']}`")
          print(f"- Baseline: `{data['baseline_version']}` at `{data['baseline_sha']}`")
          print(f"- Target: `{data['version']}` ({data['channel']})")
          print(f"- Identity: `{data['identity_sha']}`")
          print(f"- PR: #{data['pull_request']} {data['pull_request_url']}")
          PY

      - name: Upload immutable identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-identity-${{ github.run_id }}
          path: release-identity.json
          if-no-files-found: error
          retention-days: 90
