name: Release Preparation

on:
  workflow_run:
    workflows: ["CI (PR)", "Label Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open product PR number to prepare
        required: true
        type: string
      exact_version:
        description: Exact version for major/minor and beta/dev releases; stable patch releases use the next patch
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: release-preparation-${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare PR VERSION identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request", "pull_request_target"]'), github.event.workflow_run.event))
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve PR number
        id: pr
        env:
          INPUT_PR: ${{ inputs.pr_number || '' }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${INPUT_PR:-${RUN_PR}}"
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]] || { echo "A valid PR number is required" >&2; exit 2; }
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Create and verify VERSION-only preparation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          EXACT_VERSION: ${{ inputs.exact_version || '' }}
        run: |
          set -euo pipefail
          args=(create --repository "${GITHUB_REPOSITORY}" --pr-number "${PR_NUMBER}")
          if [[ -n "${EXACT_VERSION}" ]]; then
            args+=(--exact-version "${EXACT_VERSION}")
          fi
          args+=(--output release-intent.json)
          python3 .github/scripts/release_preparation.py create \
            "${args[@]:1}"

      - name: Publish preparation provenance
        uses: actions/upload-artifact@v4
        with:
          name: release-intent-pr-${{ steps.pr.outputs.pr_number }}-${{ github.run_id }}
          path: release-intent.json
          if-no-files-found: error
          retention-days: 14

  completion:
    name: Publish Release completion check
    needs: [prepare]
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: read
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve prepared PR head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo "A valid PR number is required" >&2; exit 2; }
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > pr.json
          head_sha="$(jq -r '.head.sha' pr.json)"
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "PR head SHA is invalid" >&2; exit 2; }
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify prepared identity
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/release_completion.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" > release-completion.json
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "verification_exit=${status}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish PR-head completion check
        if: always()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          CONCLUSION: ${{ steps.verify.outputs.conclusion || 'failure' }}
        with:
          script: |
            const fs = require('fs')
            const conclusion = process.env.CONCLUSION
            const errorText = fs.existsSync('release-completion.json')
              ? fs.readFileSync('release-completion.json', 'utf8').slice(0, 6000)
              : 'Release completion did not produce a result.'
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Release completion',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion,
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: conclusion === 'success' ? 'Release identity accepted' : 'Release identity rejected',
                summary: errorText,
              },
            })

      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-completion-${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}-${{ github.run_id }}
          path: release-completion.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when completion is rejected
        if: steps.verify.outputs.conclusion != 'success'
        run: exit 1
