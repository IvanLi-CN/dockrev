name: Release abort

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reserved version to abandon (X.Y.Z, X.Y.Z-alpha.N, -beta.N, -rc.N)
        required: true
        type: string
      reason:
        description: Why this unmerged release identity is being abandoned
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-abort
  cancel-in-progress: false

jobs:
  abort:
    name: Abandon unmerged release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main release policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Abort the unmerged identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
          ABORT_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_abort.py \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GITHUB_TOKEN}" \
            --version "${VERSION_INPUT}" \
            --reason "${ABORT_REASON}" \
            --output release-abort.json

      - name: Summarize aborted identity
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("release-abort.json").read_text(encoding="utf-8"))
          print("## Release identity aborted")
          print()
          print(f"- Version: `{data['version']}`")
          print(f"- Identity: `{data['identity_sha']}`")
          print(f"- Reason: {data['reason']}")
          print(f"- Closed PR: #{data['closed_pull_request']}" if data["closed_pull_request"] else "- Closed PR: none")
          print(f"- Deleted refs: {', '.join(data['deleted_refs']) or 'none'}")
          print()
          print("No tag or GitHub Release was created for this identity, so the version is free for a new preparation run.")
          PY

      - name: Upload abort evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-abort-${{ github.run_id }}
          path: release-abort.json
          if-no-files-found: warn
          retention-days: 90
