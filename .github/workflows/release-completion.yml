name: Release completion

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

concurrency:
  group: release-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  completion:
    name: Release completion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Verify preparation and source CI binding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_completion.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${PR_NUMBER}" \
            > release-completion.json
          cat release-completion.json

      - name: Upload release completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-completion-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: release-completion.json
          if-no-files-found: error
          retention-days: 14
