name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Existing merged main SHA with an immutable release identity
        required: true
        type: string
      recovery_reason:
        description: Required reason for same-SHA recovery
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dockrev
  SUPERVISOR_IMAGE_NAME: dockrev-supervisor
  RUST_TOOLCHAIN: "1.91.0"

concurrency:
  group: release-${{ inputs.merge_sha || github.sha }}
  cancel-in-progress: false

jobs:
  identity:
    name: Resolve merged release identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      release_enabled: ${{ steps.resolve.outputs.release_enabled }}
      pull_request: ${{ steps.resolve.outputs.pull_request }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      type: ${{ steps.resolve.outputs.type }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      identity_json: ${{ steps.resolve.outputs.identity_json }}
      identity_failure_kind: ${{ steps.resolve.outputs.identity_failure_kind }}
    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0

      - name: Checkout trusted release helpers
        uses: actions/checkout@v4
        with:
          ref: main
          path: .workflow-src
          fetch-depth: 1

      - name: Resolve and validate identity
        id: resolve
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ inputs.merge_sha || github.sha }}
          RECOVERY_REASON: ${{ inputs.recovery_reason || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "merge_sha must be a 40-character lowercase SHA" >&2; exit 2; }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${RECOVERY_REASON//[[:space:]]/}" ]]; then
            echo "recovery_reason is required for same-SHA recovery" >&2
            exit 2
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${MERGE_SHA}" origin/main
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            prior_failure="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?head_sha=${MERGE_SHA}&per_page=100" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(any(run.get("event") == "push" and run.get("conclusion") == "failure" for run in data.get("workflow_runs", [])))')"
            [[ "${prior_failure}" == "True" ]] || { echo "same-SHA recovery requires a prior failed automatic Release run" >&2; exit 2; }
          fi
          set +e
          python3 .workflow-src/.github/scripts/release_identity.py \
              --repository "${GITHUB_REPOSITORY}" \
              --merge-sha "${MERGE_SHA}" \
              --token "${GITHUB_TOKEN}" \
              --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > release-intent.json
          status=$?
          set -e
          if [[ "${status}" -ne 0 ]]; then
            if [[ "${status}" -eq 3 ]]; then
              echo "identity_failure_kind=no-identity" >> "$GITHUB_OUTPUT"
            else
              echo "identity_failure_kind=resolver-error" >> "$GITHUB_OUTPUT"
            fi
            exit "${status}"
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path("release-intent.json").read_text())
          print(f"release_enabled={'true' if payload.get('release_enabled') else 'false'}")
          print(f"pull_request={payload.get('pull_request', '')}")
          print(f"source_sha={payload.get('source_sha', '')}")
          print(f"merge_sha={payload.get('merge_commit_sha', '')}")
          print(f"version={payload.get('version', '')}")
          print(f"release_tag={payload.get('release_tag', '')}")
          print(f"channel={payload.get('channel', '')}")
          print(f"type={payload.get('type', '')}")
          print(f"prerelease={'true' if payload.get('channel') in {'beta', 'dev'} else 'false'}")
          print("identity_json<<EOF")
          print(json.dumps(payload, sort_keys=True))
          print("EOF")
          PY

      - name: Capture identity-resolution failure context
        if: always() && steps.resolve.outcome != 'success'
        env:
          MERGE_SHA: ${{ inputs.merge_sha || github.sha }}
          FAILURE_KIND: ${{ steps.resolve.outputs.identity_failure_kind || 'resolver-error' }}
        run: |
          set -euo pipefail
          if ! [[ "${MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then MERGE_SHA="${GITHUB_SHA}"; fi
          VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-((beta|dev)\.[0-9]+))?$ ]] || VERSION="0.0.0"
          export VERSION
          python3 - <<'PY'
          import json
          import os
          version = os.environ["VERSION"]
          merge_sha = os.environ["MERGE_SHA"]
          expected = [
              suffix
              for base in [
                  f"{binary}_{version}_linux_{arch}_{libc}"
                  for arch in ("amd64", "arm64")
                  for libc in ("gnu", "musl")
                  for binary in ("dockrev", "dockrev-supervisor")
              ]
              for suffix in (f"{base}.tar.gz", f"{base}.tar.gz.sha256")
          ]
          channel = "beta" if "-beta." in version else ("dev" if "-dev." in version else "stable")
          no_identity = os.environ["FAILURE_KIND"] == "no-identity"
          payload = {
              "pull_request": 0,
              "source_sha": merge_sha,
              "merge_commit_sha": merge_sha,
              "type": "patch",
              "channel": channel,
              "version": version,
              "tag": f"v{version}",
              "artifact_names": expected,
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "recovery_instruction": (
                  f"create VERSION-only release PR Covered-Product-Merge-SHA={merge_sha}"
                  if no_identity else
                  "resolver-error: retry Release workflow after verifying merged identity"
              ),
              "identity_resolution_failed": no_identity,
              "identity_failure_kind": os.environ["FAILURE_KIND"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "Release",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
          }
          with open("identity-failure-context.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, sort_keys=True)
              handle.write("\n")
          PY

      - name: Upload identity-resolution failure context
        if: always() && steps.resolve.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-identity-failure-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: identity-failure-context.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Fail identity job after recording context
        if: always() && steps.resolve.outcome != 'success'
        run: exit 1

      - name: Reserve release tag without rewriting ownership
        if: steps.resolve.outputs.release_enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          MERGE_SHA: ${{ steps.resolve.outputs.merge_sha }}
        run: |
          set -euo pipefail
          path="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          if existing="$(gh api "${path}" 2>/tmp/release-tag-error)"; then
            owner_type="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"].get("type", ""))' <<<"${existing}")"
            owner_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"${existing}")"
            if [[ "${owner_type}" == "tag" ]]; then
              owner_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${owner_sha}" --jq .object.sha)"
            fi
            test "${owner_sha}" = "${MERGE_SHA}" || { echo "tag ${RELEASE_TAG} belongs to ${owner_sha}" >&2; exit 1; }
          else
            status=$?
            if [[ "${status}" -ne 1 ]] || ! rg -q 'HTTP 404|Not Found|404' /tmp/release-tag-error; then
              cat /tmp/release-tag-error >&2
              exit "${status}"
            fi
            echo "tag ${RELEASE_TAG} is available for ${MERGE_SHA}"
          fi

      - name: Upload immutable release identity
        uses: actions/upload-artifact@v4
        with:
          name: release-intent-${{ steps.resolve.outputs.merge_sha }}
          path: release-intent.json
          if-no-files-found: error
          retention-days: 90

  build-binaries:
    name: Build ${{ matrix.arch }} release assets
    needs: [identity]
    if: needs.identity.outputs.release_enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            gnu_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            gnu_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      CARGO_TARGET_DIR: target/release/${{ matrix.arch }}
    steps:
      - name: Checkout merge identity
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.merge_sha }}

      - name: Set up Bun and build embedded web
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.gnu_target }},${{ matrix.musl_target }}

      - name: Build gnu and musl binaries
        run: |
          set -euo pipefail
          cargo build -p dockrev-api --bin dockrev --release --locked --target "${{ matrix.gnu_target }}"
          cargo build -p dockrev-api --bin dockrev --release --locked --target "${{ matrix.musl_target }}"
          cargo build -p dockrev-supervisor --bin dockrev-supervisor --release --locked --target "${{ matrix.gnu_target }}"
          cargo build -p dockrev-supervisor --bin dockrev-supervisor --release --locked --target "${{ matrix.musl_target }}"
          mkdir -p "release-assets/${{ matrix.arch }}"/gnu "release-assets/${{ matrix.arch }}"/musl
          cp "${CARGO_TARGET_DIR}/${{ matrix.gnu_target }}/release/dockrev" "release-assets/${{ matrix.arch }}/gnu/dockrev"
          cp "${CARGO_TARGET_DIR}/${{ matrix.gnu_target }}/release/dockrev-supervisor" "release-assets/${{ matrix.arch }}/gnu/dockrev-supervisor"
          cp "${CARGO_TARGET_DIR}/${{ matrix.musl_target }}/release/dockrev" "release-assets/${{ matrix.arch }}/musl/dockrev"
          cp "${CARGO_TARGET_DIR}/${{ matrix.musl_target }}/release/dockrev-supervisor" "release-assets/${{ matrix.arch }}/musl/dockrev-supervisor"
          chmod +x release-assets/${{ matrix.arch }}/*/*

      - name: Upload architecture assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}-${{ needs.identity.outputs.merge_sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  package-assets:
    name: Package and verify release assets
    needs: [identity, build-binaries]
    if: needs.identity.outputs.release_enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact_names: ${{ steps.package.outputs.artifact_names }}
    steps:
      - name: Download architecture assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*-${{ needs.identity.outputs.merge_sha }}
          path: release-assets
          merge-multiple: true

      - name: Package tarballs and checksums
        id: package
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for arch in amd64 arm64; do
            for libc in gnu musl; do
              for binary in dockrev dockrev-supervisor; do
                source="release-assets/${arch}/${libc}/${binary}"
                test -f "${source}"
                chmod +x "${source}"
                name="${binary}_${VERSION}_linux_${arch}_${libc}"
                tar -czf "dist/release/${name}.tar.gz" -C "$(dirname "${source}")" "${binary}"
                sha256sum "dist/release/${name}.tar.gz" > "dist/release/${name}.tar.gz.sha256"
              done
            done
          done
          sha256sum -c dist/release/*.sha256
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print(f"artifact_names={json.dumps(sorted(path.name for path in Path('dist/release').iterdir() if path.is_file()))}")
          PY

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.identity.outputs.merge_sha }}
          path: dist/release
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish GHCR and GitHub Release
    needs: [identity, package-assets]
    if: needs.identity.outputs.release_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      actions: read
    concurrency:
      group: release-publish-${{ needs.identity.outputs.merge_sha }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
      CHANNEL: ${{ needs.identity.outputs.channel }}
      MERGE_SHA: ${{ needs.identity.outputs.merge_sha }}
    steps:
      - name: Checkout merge identity
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ env.MERGE_SHA }}
          path: dist/release

      - name: Create immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/tmp/release-tag-error)"; then
            owner_type="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"].get("type", ""))' <<<"${existing}")"
            owner_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"${existing}")"
            if [[ "${owner_type}" == "tag" ]]; then
              owner_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${owner_sha}" --jq .object.sha)"
            fi
            test "${owner_sha}" = "${MERGE_SHA}"
          else
            status=$?
            if [[ "${status}" -ne 1 ]] || ! rg -q 'HTTP 404|Not Found|404' /tmp/release-tag-error; then
              cat /tmp/release-tag-error >&2
              exit "${status}"
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${MERGE_SHA}"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR owner
        id: ghcr-owner
        run: echo "owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Dockrev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ghcr-owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          build-args: APP_EFFECTIVE_VERSION=${{ env.VERSION }}

      - name: Build and push supervisor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime-supervisor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ghcr-owner.outputs.owner }}/${{ env.SUPERVISOR_IMAGE_NAME }}:${{ env.VERSION }}
          build-args: APP_EFFECTIVE_VERSION=${{ env.VERSION }}

      - name: Publish GitHub Release and assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ env.MERGE_SHA }}
          name: Dockrev ${{ env.VERSION }}
          prerelease: ${{ env.CHANNEL != 'stable' }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/release/*.tar.gz,dist/release/*.sha256
          artifactErrorsFailBuild: true
          generateReleaseNotes: true

      - name: Point newest stable images at latest
        if: env.CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ steps.ghcr-owner.outputs.owner }}
        run: |
          set -euo pipefail
          highest="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.prerelease == false) | .tag_name' | python3 -c '
          import re, sys
          versions = []
          for raw in sys.stdin:
              value = raw.strip().removeprefix("v")
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value)
              if match:
                  versions.append((tuple(map(int, match.groups())), value))
          print(max(versions)[1] if versions else "")
          ')"
          if [[ "${highest}" != "${VERSION}" ]]; then
            echo "stable ${VERSION} is not the newest published stable release (${highest}); latest remains unchanged"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "${REGISTRY}/${GHCR_OWNER}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${GHCR_OWNER}/${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${GHCR_OWNER}/${SUPERVISOR_IMAGE_NAME}:latest" \
            "${REGISTRY}/${GHCR_OWNER}/${SUPERVISOR_IMAGE_NAME}:${VERSION}"


  failure-context:
    name: Record release failure context
    needs: [identity, build-binaries, package-assets, publish]
    if: >-
      always() &&
      (needs.identity.result == 'failure' || needs.build-binaries.result == 'failure' ||
      needs.package-assets.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Download identity failure context
        if: needs.identity.result == 'failure'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-identity-failure-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: identity-failure-context
          merge-multiple: true

      - name: Promote identity failure context
        if: needs.identity.result == 'failure'
        env:
          MERGE_SHA: ${{ inputs.merge_sha || github.sha }}
          FAILURE_KIND: ${{ needs.identity.outputs.identity_failure_kind || 'resolver-error' }}
        run: |
          set -euo pipefail
          if [[ -f identity-failure-context/identity-failure-context.json ]]; then
            cp identity-failure-context/identity-failure-context.json release-failure-context.json
            exit 0
          fi
          if ! [[ "${MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then MERGE_SHA="${GITHUB_SHA}"; fi
          VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-((beta|dev)\.[0-9]+))?$ ]] || VERSION="0.0.0"
          export VERSION
          python3 - <<'PY'
          import json
          import os
          version = os.environ["VERSION"]
          merge_sha = os.environ["MERGE_SHA"]
          expected = [
              suffix
              for base in [
                  f"{binary}_{version}_linux_{arch}_{libc}"
                  for arch in ("amd64", "arm64")
                  for libc in ("gnu", "musl")
                  for binary in ("dockrev", "dockrev-supervisor")
              ]
              for suffix in (f"{base}.tar.gz", f"{base}.tar.gz.sha256")
          ]
          channel = "beta" if "-beta." in version else ("dev" if "-dev." in version else "stable")
          no_identity = os.environ["FAILURE_KIND"] == "no-identity"
          payload = {
              "pull_request": 0,
              "source_sha": merge_sha,
              "merge_commit_sha": merge_sha,
              "type": "patch",
              "channel": channel,
              "version": version,
              "tag": f"v{version}",
              "artifact_names": expected,
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "recovery_instruction": (
                  f"create VERSION-only release PR Covered-Product-Merge-SHA={merge_sha}"
                  if no_identity else
                  "resolver-error: retry Release workflow after verifying merged identity"
              ),
              "identity_resolution_failed": no_identity,
              "identity_failure_kind": os.environ["FAILURE_KIND"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "Release",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
          }
          with open("release-failure-context.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, sort_keys=True)
              handle.write("\n")
          PY

      - name: Write structured failure context
        if: needs.identity.result != 'failure'
        env:
          RELEASE_TYPE: ${{ needs.identity.outputs.type }}
          RELEASE_CHANNEL: ${{ needs.identity.outputs.channel }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
          RELEASE_MERGE_SHA: ${{ needs.identity.outputs.merge_sha }}
          RELEASE_SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          RELEASE_PR_NUMBER: ${{ needs.identity.outputs.pull_request }}
          RELEASE_ARTIFACT_NAMES: ${{ needs.package-assets.outputs.artifact_names }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          version = os.environ["RELEASE_VERSION"]
          expected = [
              suffix
              for base in [
                  f"{binary}_{version}_linux_{arch}_{libc}"
                  for arch in ("amd64", "arm64")
                  for libc in ("gnu", "musl")
                  for binary in ("dockrev", "dockrev-supervisor")
              ]
              for suffix in (f"{base}.tar.gz", f"{base}.tar.gz.sha256")
          ]
          artifacts = json.loads(os.environ["RELEASE_ARTIFACT_NAMES"] or "null") or expected
          payload = {
              "pull_request": int(os.environ["RELEASE_PR_NUMBER"] or "0"),
              "source_sha": os.environ["RELEASE_SOURCE_SHA"],
              "merge_commit_sha": os.environ["RELEASE_MERGE_SHA"],
              "type": os.environ["RELEASE_TYPE"],
              "channel": os.environ["RELEASE_CHANNEL"],
              "version": version,
              "tag": os.environ["RELEASE_TAG"],
              "artifact_names": artifacts,
              "run_url": os.environ["RELEASE_RUN_URL"],
              "recovery_instruction": "workflow_dispatch merge_sha=" + os.environ["RELEASE_MERGE_SHA"] + " recovery_reason=<required>",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "Release",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
          }
          with open("release-failure-context.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, sort_keys=True)
              handle.write("\n")
          PY

      - name: Upload failure context
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-failure-context.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
