name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Next-version intent (patch, minor, major, alpha, beta, rc) or an owner-selected SemVer
        required: true
        type: string
      source_sha:
        description: Optional existing dispatch source SHA to finish an incomplete publication
        required: false
        type: string

permissions:
  actions: read
  contents: write
  packages: write
  workflows: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dockrev
  SUPERVISOR_IMAGE_NAME: dockrev-supervisor
  RUST_TOOLCHAIN: "1.91.0"

concurrency:
  group: release-dockrev
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      baseline_version: ${{ steps.baseline.outputs.version }}
      version_input: ${{ steps.version.outputs.version_input }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out the dispatch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate dispatch source and CI proof
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          source_sha="${INPUT_SOURCE_SHA:-${GITHUB_SHA}}"
          python3 .github/scripts/release_intent.py intent \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --source-sha "${source_sha}" \
            --ref "${GITHUB_REF}" \
            --target "${TARGET}" \
            --workflow ci-main.yml \
            --output intent.json
          echo "source_sha=$(jq -r .source_sha intent.json)" >> "$GITHUB_OUTPUT"

      - name: Inspect the trusted final baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_intent.py baseline \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --workflow ci-main.yml \
            --output baseline.json
          echo "version=$(jq -r .version baseline.json)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r .source_sha baseline.json)" >> "$GITHUB_OUTPUT"

      - name: Verify the fixed release range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_intent.py range \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --baseline-sha "${{ steps.baseline.outputs.source_sha }}" \
            --source-sha "${{ steps.source.outputs.source_sha }}" \
            --output range.json

      - name: Resolve the canonical version
        id: version
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          git tag --list 'v[0-9]*' > tags.txt
          python3 .github/scripts/release_intent.py resolve \
            --repository "${GITHUB_REPOSITORY}" \
            --token "unused" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --target "${TARGET}" \
            --tags tags.txt \
            --output version.json
          {
            echo "version_input=$(jq -r .version_input version.json)"
            echo "version=$(jq -r .version version.json)"
            echo "channel=$(jq -r .channel version.json)"
            echo "release_tag=$(jq -r .release_tag version.json)"
            echo "prerelease=$(jq -r '.channel != "stable"' version.json)"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.arch }} release assets
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            gnu_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            gnu_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      CARGO_TARGET_DIR: target/release/${{ matrix.arch }}
    steps:
      - name: Check out the fixed release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Set up Bun and build embedded web
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.gnu_target }},${{ matrix.musl_target }}

      - name: Build gnu and musl binaries
        run: |
          set -euo pipefail
          cargo build -p dockrev-api --bin dockrev --release --locked --target "${{ matrix.gnu_target }}"
          cargo build -p dockrev-api --bin dockrev --release --locked --target "${{ matrix.musl_target }}"
          cargo build -p dockrev-supervisor --bin dockrev-supervisor --release --locked --target "${{ matrix.gnu_target }}"
          cargo build -p dockrev-supervisor --bin dockrev-supervisor --release --locked --target "${{ matrix.musl_target }}"
          mkdir -p "release-assets/${{ matrix.arch }}"/gnu "release-assets/${{ matrix.arch }}"/musl
          cp "${CARGO_TARGET_DIR}/${{ matrix.gnu_target }}/release/dockrev" "release-assets/${{ matrix.arch }}/gnu/dockrev"
          cp "${CARGO_TARGET_DIR}/${{ matrix.gnu_target }}/release/dockrev-supervisor" "release-assets/${{ matrix.arch }}/gnu/dockrev-supervisor"
          cp "${CARGO_TARGET_DIR}/${{ matrix.musl_target }}/release/dockrev" "release-assets/${{ matrix.arch }}/musl/dockrev"
          cp "${CARGO_TARGET_DIR}/${{ matrix.musl_target }}/release/dockrev-supervisor" "release-assets/${{ matrix.arch }}/musl/dockrev-supervisor"
          chmod +x release-assets/${{ matrix.arch }}/*/*

      - name: Upload architecture assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}-${{ needs.preflight.outputs.source_sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  package-assets:
    name: Package and verify release assets
    needs: [preflight, build-binaries]
    runs-on: ubuntu-latest
    outputs:
      artifact_names: ${{ steps.package.outputs.artifact_names }}
      artifact_digest: ${{ steps.upload_bundle.outputs.artifact-digest }}
    steps:
      - name: Check out the fixed release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Download architecture assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*-${{ needs.preflight.outputs.source_sha }}
          path: release-assets
          merge-multiple: true

      - name: Package tarballs and checksums
        id: package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for arch in amd64 arm64; do
            for libc in gnu musl; do
              for binary in dockrev dockrev-supervisor; do
                source="release-assets/${arch}/${libc}/${binary}"
                test -f "${source}"
                chmod +x "${source}"
                name="${binary}_${VERSION}_linux_${arch}_${libc}"
                tar -czf "dist/release/${name}.tar.gz" -C "$(dirname "${source}")" "${binary}"
                sha256sum "dist/release/${name}.tar.gz" > "dist/release/${name}.tar.gz.sha256"
              done
            done
          done
          sha256sum -c dist/release/*.sha256
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print(f"artifact_names={json.dumps(sorted(path.name for path in Path('dist/release').iterdir() if path.is_file()))}")
          PY

      - name: Create the identity-bound release bundle
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          BASELINE_VERSION: ${{ needs.preflight.outputs.baseline_version }}
          VERSION_INPUT: ${{ needs.preflight.outputs.version_input }}
          VERSION: ${{ needs.preflight.outputs.version }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > release-identity.json
          import json
          import os
          print(json.dumps({
              "source_sha": os.environ["SOURCE_SHA"],
              "baseline_version": os.environ["BASELINE_VERSION"],
              "version_input": os.environ["VERSION_INPUT"],
              "version": os.environ["VERSION"],
              "channel": os.environ["CHANNEL"],
              "release_tag": os.environ["RELEASE_TAG"],
          }, sort_keys=True))
          PY
          python3 .github/scripts/release_artifact_bundle.py create \
            --release-assets release-assets \
            --release-files dist/release \
            --output release-bundle \
            --identity release-identity.json > release-bundle-result.json

      - name: Upload release bundle
        id: upload_bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ needs.preflight.outputs.source_sha }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GHCR and GitHub Release
    needs: [preflight, package-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      packages: write
      workflows: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      BASELINE_VERSION: ${{ needs.preflight.outputs.baseline_version }}
      VERSION_INPUT: ${{ needs.preflight.outputs.version_input }}
    steps:
      - name: Check out the fixed release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify the uploaded bundle digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DIGEST: ${{ needs.package-assets.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -n "${EXPECTED_DIGEST}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            | python3 .github/scripts/check_release_artifact_digest.py \
                --artifact-name "release-bundle-${SOURCE_SHA}" \
                --expected-digest "${EXPECTED_DIGEST}"

      - name: Download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ env.SOURCE_SHA }}
          path: release-bundle

      - name: Verify the bundle identity and file digests
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          BASELINE_VERSION: ${{ env.BASELINE_VERSION }}
          VERSION_INPUT: ${{ env.VERSION_INPUT }}
          VERSION: ${{ env.VERSION }}
          CHANNEL: ${{ env.CHANNEL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > expected-release-identity.json
          import json
          import os
          print(json.dumps({
              "source_sha": os.environ["SOURCE_SHA"],
              "baseline_version": os.environ["BASELINE_VERSION"],
              "version_input": os.environ["VERSION_INPUT"],
              "version": os.environ["VERSION"],
              "channel": os.environ["CHANNEL"],
              "release_tag": os.environ["RELEASE_TAG"],
          }, sort_keys=True))
          PY
          python3 .github/scripts/release_artifact_bundle.py verify \
            --root release-bundle \
            --identity expected-release-identity.json

      - name: Stage prebuilt Docker binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            source="release-bundle/release-assets/${arch}/musl"
            destination="dist/ci/docker/${arch}"
            mkdir -p "${destination}"
            for binary in dockrev dockrev-supervisor; do
              test -f "${source}/${binary}"
              cp "${source}/${binary}" "${destination}/${binary}"
              chmod +x "${destination}/${binary}"
            done
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR owner
        id: ghcr-owner
        run: echo "owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Inspect existing image tags
        id: existing
        run: |
          set -euo pipefail
          inspect() {
            docker buildx imagetools inspect "$1" 2>/dev/null | awk '/Digest:/ {print $2; exit}' || true
          }
          for pair in "dockrev:${IMAGE_NAME}" "supervisor:${SUPERVISOR_IMAGE_NAME}"; do
            key="${pair%%:*}"
            image="${pair#*:}"
            version_digest="$(inspect "${REGISTRY}/${{ steps.ghcr-owner.outputs.owner }}/${image}:${VERSION}")"
            source_digest="$(inspect "${REGISTRY}/${{ steps.ghcr-owner.outputs.owner }}/${image}:sha-${SOURCE_SHA}")"
            if [ -z "${version_digest}" ] && [ -z "${source_digest}" ]; then
              echo "${key}_found=false" >> "$GITHUB_OUTPUT"
            elif [ -n "${version_digest}" ] && [ "${version_digest}" = "${source_digest}" ]; then
              echo "${key}_found=true" >> "$GITHUB_OUTPUT"
              echo "${key}_digest=${version_digest}" >> "$GITHUB_OUTPUT"
            else
              echo "existing ${image} tags are partial or point to different digests; refusing to overwrite them" >&2
              exit 1
            fi
          done

      - name: Build and push the dockrev image
        id: push_app
        if: steps.existing.outputs.dockrev_found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ghcr-owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.ghcr-owner.outputs.owner }}/${{ env.IMAGE_NAME }}:sha-${{ env.SOURCE_SHA }}
          build-args: APP_EFFECTIVE_VERSION=${{ env.VERSION }}

      - name: Build and push the supervisor image
        id: push_supervisor
        if: steps.existing.outputs.supervisor_found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime-supervisor-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ghcr-owner.outputs.owner }}/${{ env.SUPERVISOR_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.ghcr-owner.outputs.owner }}/${{ env.SUPERVISOR_IMAGE_NAME }}:sha-${{ env.SOURCE_SHA }}
          build-args: APP_EFFECTIVE_VERSION=${{ env.VERSION }}

      - name: Verify image digests
        run: |
          set -euo pipefail
          inspect() {
            docker buildx imagetools inspect "$1" | awk '/Digest:/ {print $2; exit}'
          }
          dockrev_digest="${{ steps.existing.outputs.dockrev_found == 'true' && steps.existing.outputs.dockrev_digest || steps.push_app.outputs.digest }}"
          supervisor_digest="${{ steps.existing.outputs.supervisor_found == 'true' && steps.existing.outputs.supervisor_digest || steps.push_supervisor.outputs.digest }}"
          test -n "${dockrev_digest}"
          test -n "${supervisor_digest}"
          for tag in "${VERSION}" "sha-${SOURCE_SHA}"; do
            test "$(inspect "${REGISTRY}/${{ steps.ghcr-owner.outputs.owner }}/${IMAGE_NAME}:${tag}")" = "${dockrev_digest}"
            test "$(inspect "${REGISTRY}/${{ steps.ghcr-owner.outputs.owner }}/${SUPERVISOR_IMAGE_NAME}:${tag}")" = "${supervisor_digest}"
          done
          echo "dockrev_digest=${dockrev_digest}" >> "$GITHUB_OUTPUT"
          echo "supervisor_digest=${supervisor_digest}" >> "$GITHUB_OUTPUT"
        id: verify_images

      - name: Create the immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "${existing}" ]; then
            test "${existing}" = "${SOURCE_SHA}" || { echo "tag ${RELEASE_TAG} belongs to ${existing}" >&2; exit 1; }
          else
            git tag "${RELEASE_TAG}" "${SOURCE_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Record published image digests
        env:
          DOCKREV_DIGEST: ${{ steps.verify_images.outputs.dockrev_digest }}
          SUPERVISOR_DIGEST: ${{ steps.verify_images.outputs.supervisor_digest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_image_digests.py create \
            --identity expected-release-identity.json \
            --dockrev-digest "${DOCKREV_DIGEST}" \
            --supervisor-digest "${SUPERVISOR_DIGEST}" \
            --output release-images.json

      - name: Publish GitHub Release and assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ env.SOURCE_SHA }}
          name: Dockrev ${{ env.VERSION }}
          prerelease: ${{ env.CHANNEL != 'stable' }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: release-bundle/dist/release/*.tar.gz,release-bundle/dist/release/*.sha256,release-images.json
          artifactErrorsFailBuild: true
          generateReleaseNotes: true

      - name: Promote stable image aliases
        if: env.CHANNEL == 'stable'
        run: |
          set -euo pipefail
          owner="${{ steps.ghcr-owner.outputs.owner }}"
          inspect() {
            docker buildx imagetools inspect "$1" | awk '/Digest:/ {print $2; exit}'
          }
          docker buildx imagetools create \
            --tag "${REGISTRY}/${owner}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${owner}/${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${owner}/${SUPERVISOR_IMAGE_NAME}:latest" \
            "${REGISTRY}/${owner}/${SUPERVISOR_IMAGE_NAME}:${VERSION}"
          test "$(inspect "${REGISTRY}/${owner}/${IMAGE_NAME}:latest")" = "${{ steps.verify_images.outputs.dockrev_digest }}"
          test "$(inspect "${REGISTRY}/${owner}/${SUPERVISOR_IMAGE_NAME}:latest")" = "${{ steps.verify_images.outputs.supervisor_digest }}"

  failure-context:
    name: Record release failure context
    needs: [preflight, build-binaries, package-assets, publish]
    if: >-
      always() &&
      (needs.preflight.result == 'failure' || needs.build-binaries.result == 'failure' ||
      needs.package-assets.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Write structured failure context
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ github.sha }}
          RESOLVED_VERSION: ${{ needs.preflight.outputs.version }}
          RESOLVED_CHANNEL: ${{ needs.preflight.outputs.channel }}
          RESOLVED_TAG: ${{ needs.preflight.outputs.release_tag }}
          RESOLVED_VERSION_INPUT: ${{ needs.preflight.outputs.version_input }}
          RESOLVED_BASELINE: ${{ needs.preflight.outputs.baseline_version }}
          RESOLVED_SOURCE: ${{ needs.preflight.outputs.source_sha }}
          ARTIFACT_DIGEST: ${{ needs.package-assets.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          version = os.environ.get("RESOLVED_VERSION", "")
          expected_assets = [
              suffix
              for base in [
                  f"{binary}_{version}_linux_{arch}_{libc}"
                  for arch in ("amd64", "arm64")
                  for libc in ("gnu", "musl")
                  for binary in ("dockrev", "dockrev-supervisor")
              ]
              for suffix in (f"{base}.tar.gz", f"{base}.tar.gz.sha256")
          ] if version else []
          payload = {
              "target": os.environ.get("TARGET", ""),
              "source_sha": os.environ.get("RESOLVED_SOURCE") or os.environ["SOURCE_SHA"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "Release",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
          }
          if version:
              payload.update({
                  "baseline_version": os.environ.get("RESOLVED_BASELINE", ""),
                  "version_input": os.environ.get("RESOLVED_VERSION_INPUT", ""),
                  "version": version,
                  "channel": os.environ.get("RESOLVED_CHANNEL", ""),
                  "tag": os.environ.get("RESOLVED_TAG", ""),
                  "artifact_names": expected_assets,
                  "artifact_digest": os.environ.get("ARTIFACT_DIGEST", ""),
                  "recovery_instruction": "re-run Release from main with target=" + os.environ.get("RESOLVED_VERSION_INPUT", ""),
              })
          else:
              payload.update({
                  "identity_failure_kind": "preflight",
                  "recovery_instruction": "fix the preflight failure, then re-run Release from main with the same target",
              })
          with open("release-failure-context.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, sort_keys=True)
              handle.write("\n")
          PY

      - name: Upload failure context
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-failure-context.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
