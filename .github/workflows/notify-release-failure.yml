name: Notify failed release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  resolve_release_context:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      summary: ${{ steps.context.outputs.summary }}
    steps:
      - name: Checkout trusted notifier helper
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download structured release failure context
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: release-failure-context-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: release-failure-context

      - name: Validate and render failure context
        id: context
        env:
          EXPECTED_RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_failure_context.py \
            --input release-failure-context/release-failure-context.json

  notify_failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    needs: [resolve_release_context]
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: ${{ needs.resolve_release_context.outputs.summary }}

  smoke_test:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: |
        Release notification smoke test - ${{ github.repository }}
        status: smoke test
        workflow: Notify failed release
        event: workflow_dispatch
        sha: ${{ github.sha }}
        run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        recovery: workflow_dispatch smoke test only
