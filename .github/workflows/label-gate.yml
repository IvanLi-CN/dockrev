name: Label Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

concurrency:
  group: label-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  label-gate:
    name: Label Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Read labels and changed files
        id: metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            })
            const fs = require('fs')
            fs.writeFileSync(process.env.RUNNER_TEMP + '/release-labels.json', JSON.stringify((pr.labels || []).map(label => label.name)))
            fs.writeFileSync(process.env.RUNNER_TEMP + '/release-files.json', JSON.stringify(files.map(file => file.filename)))

      - name: Validate release intent labels
        env:
          LABELS_JSON: ${{ runner.temp }}/release-labels.json
          FILES_JSON: ${{ runner.temp }}/release-files.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_policy

          labels = json.loads(Path(os.environ['LABELS_JSON']).read_text())
          files = json.loads(Path(os.environ['FILES_JSON']).read_text())
          intent = release_policy.parse_labels(labels)
          print(json.dumps(intent, sort_keys=True))
          print(f"changed_files={len(files)}")
          PY

      - name: Summarize release intent
        if: always()
        env:
          LABELS_JSON: ${{ runner.temp }}/release-labels.json
        run: |
          set -euo pipefail
          {
            echo "## Label Gate"
            echo ""
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Labels: $(python3 -c 'import json,os; from pathlib import Path; print(", ".join(json.loads(Path(os.environ["LABELS_JSON"]).read_text())))')"
            echo "- Source SHA: ${{ github.event.pull_request.head.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
