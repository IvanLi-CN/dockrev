name: CI (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  RUST_TOOLCHAIN: "1.91.0"
  RELEASE_SNAPSHOT_NOTES_REF: refs/notes/release-snapshots

jobs:
  changes:
    name: Detect changes (main)
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout (for push diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - "web/**"
            docker:
              - "Dockerfile"
              - ".github/**"
              - "deploy/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**"
              - "src/**"
              - "web/**"

  lint:
    name: Lint & Checks (main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: target/ci/main/${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: File budget check
        run: python3 ./.github/scripts/check-file-budgets.py

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --locked --all-targets --all-features

      - name: Release channel contract check
        run: bash ./.github/scripts/release-channel-contract-check.sh

      - name: Live quality-gates check
        env:
          QUALITY_GATES_LIVE_RULES_MODE: require
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ./.github/scripts/check-live-quality-gates.py \
            --declaration .github/quality-gates.json \
            --repo "${GITHUB_REPOSITORY}"

  unit-tests:
    name: Backend Tests (main)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: target/ci/main/${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Run cargo test
        run: cargo test --workspace --locked --all-features

  deploy-smoke:
    name: Deploy Smoke (main)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy smoke
        shell: bash
        run: bash ./.github/scripts/deploy-smoke.sh

      - name: Upload deploy smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.job }}
          path: .artifacts/deploy-smoke
          if-no-files-found: error
          retention-days: 7

  frontend-lint-build:
    name: Frontend lint + build (main)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          # Avoid GitHub API rate limits (setup-bun fetches tags/releases).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: bun install (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile

      - name: Front-end lint + build
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun run lint
          bun run build
          DOCKREV_WEB_BASE=/demo/ bun run build:demo:pages

  frontend-storybook-build:
    name: Frontend Storybook build (main)
    runs-on: ubuntu-latest
    needs: [frontend-lint-build]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          # Avoid GitHub API rate limits (setup-bun fetches tags/releases).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: bun install (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile

      - name: Build Storybook static bundle
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun run build-storybook -- --quiet

      - name: Upload Storybook static artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ github.sha }}
          path: web/storybook-static
          retention-days: 1
          if-no-files-found: error

  frontend-storybook-test:
    name: Frontend Storybook test (main)
    runs-on: ubuntu-latest
    needs: [frontend-storybook-build]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          # Avoid GitHub API rate limits (setup-bun fetches tags/releases).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: bun install (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          cd web
          bun install --frozen-lockfile

      - name: Download Storybook static artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static-${{ github.sha }}
          path: web/storybook-static

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run Storybook Playwright check (timeout + retry)
        shell: bash
        run: bash ./.github/scripts/storybook-ci-check.sh

  release-snapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - deploy-smoke
      - frontend-lint-build
      - frontend-storybook-build
      - frontend-storybook-test
    if: >-
      always() &&
      needs.lint.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      (needs.deploy-smoke.result == 'success' || needs.deploy-smoke.result == 'skipped') &&
      (needs.frontend-lint-build.result == 'success' || needs.frontend-lint-build.result == 'skipped') &&
      (needs.frontend-storybook-build.result == 'success' || needs.frontend-storybook-build.result == 'skipped') &&
      (needs.frontend-storybook-test.result == 'success' || needs.frontend-storybook-test.result == 'skipped')
    permissions:
      contents: write
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity for release notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure immutable release snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_snapshot.py ensure \
            --target-sha "${GITHUB_SHA}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-token "${GITHUB_TOKEN}" \
            --notes-ref "${RELEASE_SNAPSHOT_NOTES_REF}" \
            --registry "${REGISTRY}" \
            --output "$RUNNER_TEMP/release-snapshot.json"

      - name: Show release snapshot summary
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/release-snapshot.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["SNAPSHOT_PATH"]).read_text())
          print("release_enabled=", payload["release_enabled"])
          print("target_sha=", payload["target_sha"])
          print("release_tag=", payload.get("release_tag", ""))
          print("pr_number=", payload.get("pr_number", ""))
          PY
