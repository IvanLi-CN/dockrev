name: Release Candidate Pipeline

run-name: Release candidate ${{ inputs.target_sha || github.sha }} (${{ github.event_name == 'push' && 'push' || inputs.operation }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit to verify or recover
        required: false
        default: ""
        type: string
      operation:
        description: Candidate operation
        required: true
        default: verify
        type: choice
        options:
          - verify
          - recover
      recovery_reason:
        description: Required audit reason when operation=recover
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: release-candidate-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha || github.sha }}
  CANDIDATE_OPERATION: ${{ github.event_name == 'push' && 'push' || inputs.operation }}
  VERIFICATION_MODE: ${{ github.event_name == 'push' && false || inputs.operation == 'verify' }}

jobs:
  recovery-preflight:
    name: Candidate preflight
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      operation: ${{ steps.resolve.outputs.operation }}
      verification_mode: ${{ steps.resolve.outputs.verification_mode }}
      release_enabled: ${{ steps.resolve.outputs.release_enabled }}
      target_only: ${{ steps.resolve.outputs.target_only }}
      recovery_reason: ${{ steps.resolve.outputs.recovery_reason }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout main for recovery ordering
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve operation and candidate intent
        id: resolve
        shell: bash
        env:
          TARGET_INPUT: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
          OPERATION: ${{ env.CANDIDATE_OPERATION }}
          RECOVERY_REASON: ${{ inputs.recovery_reason || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "CANDIDATE_OPERATION=${OPERATION}"
          if [[ "${OPERATION}" != "push" && "${OPERATION}" != "verify" && "${OPERATION}" != "recover" ]]; then
            echo "unsupported candidate operation: ${OPERATION}" >&2
            exit 2
          fi
          if [[ "${OPERATION}" == "recover" && -z "${{ inputs.target_sha }}" ]]; then
            echo "recover requires an explicitly supplied target_sha" >&2
            exit 2
          fi
          if [[ ! "${TARGET_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a 40-character lowercase commit SHA" >&2
            exit 2
          fi
          if [[ "${OPERATION}" == "recover" && -z "${RECOVERY_REASON//[[:space:]]/}" ]]; then
            echo "recovery_reason is required for recover" >&2
            exit 2
          fi
          {
            echo "operation=${OPERATION}"
            echo "target_sha=${TARGET_INPUT}"
            echo "verification_mode=$([[ "${OPERATION}" == "verify" ]] && echo true || echo false)"
            echo "recovery_reason=${RECOVERY_REASON}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${OPERATION}" == "recover" ]]; then
            python3 .github/scripts/release_readiness.py recover-preflight \
              --target-sha "${TARGET_INPUT}" \
              --repository "${GITHUB_REPOSITORY}" \
              --token "${GITHUB_TOKEN}" \
              --api-root "${GITHUB_API_URL}" \
              --main-ref origin/main \
              --publication-notes-ref refs/notes/release-publications \
              --github-output "$GITHUB_OUTPUT"
            echo "target_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 .github/scripts/release_preparation.py candidate \
            --target-sha "${TARGET_INPUT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GITHUB_TOKEN}" \
            --output "$RUNNER_TEMP/release-candidate.json"
          python3 - "$RUNNER_TEMP/release-candidate.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          print(f"release_enabled={'true' if payload['release_enabled'] else 'false'}")
          print(f"target_only={'false' if payload['release_enabled'] else 'true'}")
          PY
  fast:
    name: Fast CI (exact SHA)
    needs: [recovery-preflight]
    uses: ./.github/workflows/ci-main.yml
    with:
      target_sha: ${{ needs.recovery-preflight.outputs.target_sha }}
      force_full: false
      verification_mode: ${{ needs.recovery-preflight.outputs.verification_mode == 'true' }}
      candidate_invocation: true
      snapshot_source: ${{ needs.recovery-preflight.outputs.operation == 'recover' && 'candidate-recovery' || 'ci-main' }}
      target_only: ${{ needs.recovery-preflight.outputs.target_only == 'true' }}
    permissions:
      actions: write
      contents: write
      pull-requests: read
    secrets: inherit

  source:
    name: Source gate (exact SHA)
    needs: [recovery-preflight]
    uses: ./.github/workflows/source-build-release-gate.yml
    with:
      target_sha: ${{ needs.recovery-preflight.outputs.target_sha }}
      force_full: false
      verification_mode: ${{ needs.recovery-preflight.outputs.verification_mode == 'true' }}
    permissions:
      actions: write
      contents: read
    secrets: inherit

  preparation:
    name: Release preparation (exact SHA)
    needs: [recovery-preflight]
    uses: ./.github/workflows/release-preparation.yml
    with:
      target_sha: ${{ needs.recovery-preflight.outputs.target_sha }}
      verification_mode: ${{ needs.recovery-preflight.outputs.verification_mode == 'true' }}
      candidate_invocation: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    secrets: inherit

  readiness:
    name: Write immutable readiness receipt
    runs-on: ubuntu-latest
    needs: [recovery-preflight, fast, source, preparation]
    if: >-
      needs.recovery-preflight.outputs.verification_mode == 'false' &&
      needs.fast.result == 'success' &&
      needs.source.result == 'success' &&
      needs.preparation.result == 'success' &&
      needs.preparation.outputs.release_enabled == 'true'
    permissions:
      actions: read
      contents: write
    env:
      TARGET_SHA: ${{ needs.fast.outputs.target_sha }}
      CANDIDATE_OPERATION: ${{ needs.recovery-preflight.outputs.operation }}
      RECOVERY_REASON: ${{ needs.recovery-preflight.outputs.recovery_reason }}
      FAST_RESULT: ${{ needs.fast.outputs.gate_result }}
      SOURCE_TARGET_SHA: ${{ needs.source.outputs.target_sha }}
      SOURCE_RESULT: ${{ needs.source.outputs.gate_result }}
      SOURCE_RUN_ID: ${{ needs.source.outputs.run_id }}
      SOURCE_ARTIFACT_NAME: ${{ needs.source.outputs.attestation_artifact_name }}
      PREPARATION_TARGET_SHA: ${{ needs.preparation.outputs.target_sha }}
      PREPARATION_RUN_ID: ${{ needs.preparation.outputs.artifact_run_id }}
      PREPARATION_ARTIFACT_NAME: ${{ needs.preparation.outputs.artifact_name }}
      PREPARATION_MANIFEST_SHA256: ${{ needs.preparation.outputs.manifest_sha256 }}
    steps:
      - name: Checkout target and workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Checkout trusted workflow helpers
        uses: actions/checkout@v4
        with:
          ref: main
          path: .workflow-src
          fetch-depth: 1

      - name: Download source gate attestation
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-gate

      - name: Download preparation artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREPARATION_ARTIFACT_NAME }}
          run-id: ${{ env.PREPARATION_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preparation

      - name: Validate exact-SHA candidate evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${TARGET_SHA}" = "${SOURCE_TARGET_SHA}"
          test "${TARGET_SHA}" = "${PREPARATION_TARGET_SHA}"
          test "${FAST_RESULT}" = "success"
          test "${SOURCE_RESULT}" = "success"
          python3 .workflow-src/.github/scripts/release_source_gate.py validate \
            --fixture source-gate/source-gate-attestation.json \
            --target-sha "${TARGET_SHA}" \
            --kind push
          python3 .workflow-src/.github/scripts/release_preparation.py validate \
            --manifest preparation/release-preparation-manifest.json \
            --target-sha "${TARGET_SHA}"
          test "$(python3 - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          payload = json.loads(Path("preparation/release-preparation-manifest.json").read_text())
          print(hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()).hexdigest())
          PY
          )" = "${PREPARATION_MANIFEST_SHA256}"
          echo "CANDIDATE_OPERATION=${CANDIDATE_OPERATION}"

      - name: Configure git identity for readiness notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write immutable readiness receipt
        shell: bash
        run: |
          set -euo pipefail
          source_digest="$(sha256sum source-gate/source-gate-attestation.json | awk '{print $1}')"
          export SOURCE_DIGEST="${source_digest}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "target_sha": os.environ["TARGET_SHA"],
              "candidate_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "candidate_workflow": "Release Candidate Pipeline",
              "candidate_event": os.environ.get("GITHUB_EVENT_NAME", "push"),
              "operation": os.environ["CANDIDATE_OPERATION"],
              "verification_mode": False,
              "publish": False,
              "source_gate": {
                  "target_sha": os.environ["SOURCE_TARGET_SHA"],
                  "run_id": int(os.environ["SOURCE_RUN_ID"]),
                  "artifact_name": os.environ["SOURCE_ARTIFACT_NAME"],
                  "attestation_sha256": os.environ["SOURCE_DIGEST"],
                  "gate_result": os.environ["SOURCE_RESULT"],
                  "publish": False,
              },
              "preparation": {
                  "target_sha": os.environ["PREPARATION_TARGET_SHA"],
                  "run_id": int(os.environ["PREPARATION_RUN_ID"]),
                  "artifact_name": os.environ["PREPARATION_ARTIFACT_NAME"],
                  "manifest_sha256": os.environ["PREPARATION_MANIFEST_SHA256"],
                  "publish": False,
              },
              "created_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          if payload["operation"] == "recover":
              payload["recovery"] = {
                  "mode": "candidate-recovery",
                  "target_sha": payload["target_sha"],
                  "actor": os.environ["GITHUB_ACTOR"],
                  "reason": os.environ["RECOVERY_REASON"],
              }
          Path("release-readiness.json").write_text(json.dumps(payload, sort_keys=True) + "\n")
          PY
          python3 .workflow-src/.github/scripts/release_readiness.py write \
            --receipt release-readiness.json \
            --readiness-notes-ref refs/notes/release-readiness
