name: Release completion

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

concurrency:
  group: release-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  completion:
    name: Release completion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Verify release identity completion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_completion.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" | tee release-completion.json

      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-completion-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: release-completion.json
          if-no-files-found: error
          retention-days: 14
