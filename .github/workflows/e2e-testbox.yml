name: E2E (codex-testbox)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Testbox E2E scenario to run
        required: true
        default: all
        type: choice
        options:
          - all
          - full-deploy-smoke
          - check-job-recovery
          - check-version-inference-sse
          - check-service-update-no-semver-pull
      repeat_count:
        description: Times to rerun each selected scenario (1-3)
        required: true
        default: 1
        type: number
      keep_remote_artifacts:
        description: Keep remote testbox artifacts for debugging
        required: true
        default: false
        type: boolean
      testbox_host:
        description: SSH host alias or hostname for the shared testbox
        required: true
        default: codex-testbox
        type: string

concurrency:
  group: e2e-testbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testbox-e2e:
    name: codex-testbox E2E
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    env:
      TESTBOX_E2E_SCENARIO: ${{ inputs.scenario }}
      TESTBOX_E2E_REPEAT: ${{ inputs.repeat_count }}
      TESTBOX_HOST: ${{ inputs.testbox_host }}
      DOCKREV_TEST_KEEP: ${{ inputs.keep_remote_artifacts && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        if: ${{ inputs.scenario == 'all' || inputs.scenario == 'full-deploy-smoke' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: x86_64-unknown-linux-musl

      - name: Prepare linux/amd64 prebuilt deploy artifacts
        if: ${{ inputs.scenario == 'all' || inputs.scenario == 'full-deploy-smoke' }}
        shell: bash
        env:
          CARGO_TARGET_DIR: target/ci/testbox-e2e
        run: |
          set -euo pipefail
          if ! command -v musl-gcc >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y musl-tools pkg-config libsqlite3-dev
            else
              echo "musl-gcc is required for full-deploy-smoke but apt-get is unavailable" >&2
              exit 69
            fi
          fi
          command -v pkg-config >/dev/null 2>&1 || { echo "pkg-config is required" >&2; exit 69; }
          cargo build -p dockrev-api --bin dockrev --release --locked --target x86_64-unknown-linux-musl
          cargo build -p dockrev-supervisor --bin dockrev-supervisor --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist/ci/docker/amd64
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/dockrev" dist/ci/docker/amd64/dockrev
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/dockrev-supervisor" dist/ci/docker/amd64/dockrev-supervisor
          chmod 0755 dist/ci/docker/amd64/dockrev dist/ci/docker/amd64/dockrev-supervisor

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v ssh
          command -v rsync
          command -v bun

      - name: Run testbox E2E scenario
        shell: bash
        run: bash ./.github/scripts/testbox-e2e.sh

      - name: Upload testbox E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbox-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/testbox-e2e
          if-no-files-found: error
          retention-days: 7
