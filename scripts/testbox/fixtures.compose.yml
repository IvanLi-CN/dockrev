services:
  # Keep these services simple: no ports exposed, just enough containers with image tags
  # so Dockrev discovery can register a Compose project and checks do real registry work.
  nginx:
    image: nginx:1.27-alpine

  redis:
    image: redis:7.4-alpine

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "test"

  httpd:
    image: httpd:2.4-alpine

  memcached:
    image: memcached:1.6-alpine

  registry:
    image: registry:2

  busybox:
    image: busybox:1.36
    command: ["sh", "-lc", "sleep 3600"]

  alpine:
    image: alpine:3.20
    command: ["sh", "-lc", "sleep 3600"]

  prometheus:
    image: prom/prometheus:v2.55.0

  haproxy:
    image: haproxy:3.0-alpine
