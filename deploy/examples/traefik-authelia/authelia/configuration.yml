server:
  address: tcp://0.0.0.0:9091

log:
  level: info

identity_validation:
  reset_password:
    jwt_secret: change-me-with-a-long-random-string

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: deny
  rules:
    # Transparent Dockrev ingress: allow the request to pass so Dockrev can return
    # its own 401/authz diagnostics, while Authelia still supplies trusted headers
    # for requests that already carry an Authelia session.
    - domain: dockrev.example.com
      policy: bypass

session:
  secret: change-me-with-a-long-random-string
  cookies:
    - domain: example.com
      authelia_url: https://auth.example.com
      default_redirection_url: https://dockrev.example.com

storage:
  encryption_key: change-me-with-a-long-random-string
  local:
    path: /config/data/db.sqlite3

notifier:
  filesystem:
    filename: /config/data/notification.txt
